name: OPA Exemption Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  approve-exemption:
    name: Review OPA Exemption
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[OPA Exemption]') &&
      github.event.comment.body == '/approve-opa' &&
      github.actor == 'NiteeshaNadella'

    runs-on: ubuntu-latest

    steps:
      - name: Create exemption approval pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.issue.number;

            // Only the repository owner may approve exemptions.
            if (
              context.actor.toLowerCase() !==
              'niteeshanadella'
            ) {
              throw new Error('Unauthorized approver.');
            }

            // Read the current issue.
            const response = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue
            });

            const request = response.data;
            const body = request.body || '';

            function getField(label) {
              const expression = new RegExp(
                '### ' + label +
                '\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)'
              );

              const match = body.match(expression);

              if (!match) {
                throw new Error('Missing field: ' + label);
              }

              return match[1].trim();
            }

            const application = getField('Application Name');
            const policy = getField('OPA Policy');
            const resource = getField('Terraform Resource Address');
            const value = getField('Requested Exception Value');
            const reason = getField('Business Justification');
            const ticket = getField('Change or Approval Ticket');
            const expiryDate = getField('Exemption Expiry Date');

            // Validate application name.
            if (!/^[A-Za-z0-9_-]{1,80}$/.test(application)) {
              throw new Error('Invalid application name.');
            }

            // Confirm application is registered.
            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path: `applications/${application}`,
                ref: 'main'
              });
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  `Application ${application} is not registered.`
                );
              }
              throw error;
            }

            // Current automation supports VM-size exemptions.
            if (policy !== 'vm_size') {
              throw new Error(
                'Automation currently supports vm_size only.'
              );
            }

            if (
              !/^azurerm_(linux|windows)_virtual_machine\.[A-Za-z0-9_-]+$/.test(resource)
            ) {
              throw new Error('Invalid Terraform VM resource.');
            }

            if (!/^Standard_[A-Za-z0-9_]+$/.test(value)) {
              throw new Error('Invalid Azure VM size.');
            }

            if (!reason || reason.length > 2000) {
              throw new Error('Invalid business justification.');
            }

            if (!/^[A-Za-z0-9_-]{3,80}$/.test(ticket)) {
              throw new Error('Invalid ticket number.');
            }

            if (!/^\d{4}-\d{2}-\d{2}$/.test(expiryDate)) {
              throw new Error('Invalid expiry date format.');
            }

            const expiresAt = expiryDate + 'T23:59:59Z';

            if (
              !Number.isFinite(Date.parse(expiresAt)) ||
              Date.parse(expiresAt) <= Date.now()
            ) {
              throw new Error('Expiry date must be in the future.');
            }

            // Determine application-specific exemption file.
            const path = `exemptions/${application}.json`;

            // Load existing exemptions or initialize new file.
            let file = null;
            let configuration = { exemptions: [] };

            try {
              const fileResponse =
                await github.rest.repos.getContent({
                  owner,
                  repo,
                  path,
                  ref: 'main'
                });

              file = fileResponse.data;

              if (file.type !== 'file') {
                throw new Error(
                  'Exemption configuration is not a file.'
                );
              }

              const content = Buffer.from(
                file.content,
                'base64'
              ).toString('utf8');

              configuration = JSON.parse(content);

            } catch (error) {
              if (error.status === 404) {
                core.info(
                  `Creating new exemption file for ${application}`
                );
              } else {
                throw error;
              }
            }

            if (!Array.isArray(configuration.exemptions)) {
              throw new Error(
                'Invalid exemption configuration.'
              );
            }

            // Avoid duplicate exemption entries.
            const duplicate = configuration.exemptions.some(e =>
              e.application === application &&
              e.policy === policy &&
              e.resource === resource &&
              e.approved_size === value
            );

            if (duplicate) {
              throw new Error(
                'An exemption already exists for this application, resource and size.'
              );
            }

            // Add the approved exemption.
            configuration.exemptions.push({
              application,
              policy,
              resource,
              approved_size: value,
              reason,
              ticket,
              expires_at: expiresAt
            });

            // Read main branch reference.
            const main = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main'
            });

            // Create a unique branch for the issue.
            const branch = `opa-exemption/issue-${issue}`;

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: main.data.object.sha
            });

            // Create or update exemption JSON on branch.
            const updateRequest = {
              owner,
              repo,
              path,
              branch,
              message: `Propose OPA exemption from issue #${issue}`,
              content: Buffer.from(
                JSON.stringify(configuration, null, 2) + '\n'
              ).toString('base64')
            };

            // SHA is required only for an existing file.
            if (file) {
              updateRequest.sha = file.sha;
            }

            await github.rest.repos.createOrUpdateFileContents(
              updateRequest
            );

            // Create pull request for review.
            const pull = await github.rest.pulls.create({
              owner,
              repo,
              title: `OPA exemption: ${application} - ${policy}`,
              head: branch,
              base: 'main',
              body:
                `Exemption requested in #${issue}.\n\n` +
                `Application: ${application}\n\n` +
                `Policy: ${policy}\n\n` +
                `Ticket: ${ticket}\n\n` +
                `Expires: ${expiresAt}\n\n` +
                `Review the proposed JSON change before merging.`
            });

            // Notify requester.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue,
              body:
                `Approval received from @${context.actor}.\n\n` +
                `A proposed exemption has been created: #${pull.data.number}.\n\n` +
                `The exemption will become active only after the pull request is reviewed and merged.`
            });

            core.info(
              `Created exemption PR #${pull.data.number}`
            );
