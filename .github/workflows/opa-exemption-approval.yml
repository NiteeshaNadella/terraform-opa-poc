
name: OPA Exemption Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  approve-exemption:
    name: Review OPA Exemption
    if: |
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, '[OPA Exemption]') &&
      github.event.comment.body == '/approve-opa' &&
      github.actor == 'NiteeshaNadella'

    runs-on: ubuntu-latest

    steps:
      - name: Create exemption approval pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.issue.number;

            // Only the designated POC administrator may approve.
            if (context.actor.toLowerCase() !== 'niteeshanadella') {
              throw new Error('Unauthorized approver.');
            }

            // Read the exemption request issue.
            const response = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issue
            });

            const body = response.data.body || '';

            function getField(label) {
              const expression = new RegExp(
                '### ' + label +
                '\\r?\\n([\\s\\S]*?)(?=\\r?\\n### |$)'
              );

              const match = body.match(expression);

              if (!match) {
                throw new Error('Missing field: ' + label);
              }

              const value = match[1].trim();

              if (!value || value === '_No response_') {
                throw new Error('Empty field: ' + label);
              }

              return value;
            }

            const application = getField('Application Name');
            const repository = getField('GitHub Repository');
            const policy = getField('OPA Policy');
            const resource = getField('Terraform Resource Address');
            const value = getField('Requested Exception Value');
            const reason = getField('Business Justification');
            const ticket = getField('Change or Approval Ticket');
            const expiryDate = getField('Exemption Expiry Date');

            // Validate application name.
            if (!/^[A-Za-z0-9_-]{1,80}$/.test(application)) {
              throw new Error('Invalid application name.');
            }

            // Validate the full repository identity.
            const repositoryMatch = repository.match(
              /^([A-Za-z0-9-]+)\/([A-Za-z0-9._-]+)$/
            );

            if (!repositoryMatch) {
              throw new Error('Invalid GitHub repository format.');
            }

            const repositoryOwner = repositoryMatch[1];
            const repositoryName = repositoryMatch[2];

            // POC trust boundary: only repositories owned by this account.
            if (repositoryOwner.toLowerCase() !== owner.toLowerCase()) {
              throw new Error(
                'Repository owner is not authorized for this POC.'
              );
            }

            if (repositoryName.toLowerCase() !== application.toLowerCase()) {
              throw new Error(
                'Application name must match the GitHub repository name.'
              );
            }

            // Verify that the independent GitHub repository exists.
            const repositoryResponse = await github.rest.repos.get({
              owner: repositoryOwner,
              repo: repositoryName
            });

            if (
              repositoryResponse.data.full_name.toLowerCase() !==
              repository.toLowerCase()
            ) {
              throw new Error('Repository identity verification failed.');
            }

            core.info(`Verified repository: ${repository}`);

            // Validate supported policy and exception value.
            let exemptionValue = {};

            if (policy === 'vm_size') {
              if (!/^azurerm_(linux|windows)_virtual_machine\.[A-Za-z0-9_-]+$/.test(resource)) {
                throw new Error('Invalid Terraform VM resource.');
              }

              if (!/^Standard_[A-Za-z0-9_]+$/.test(value)) {
                throw new Error('Invalid Azure VM size.');
              }

              exemptionValue = { approved_size: value };

            } else if (policy === 'tags') {
              if (!/^azurerm_(resource_group|storage_account)\.[A-Za-z0-9_-]+$/.test(resource)) {
                throw new Error('Invalid Terraform resource for tags policy.');
              }

              if (!['environment', 'project', 'owner', 'costcenter'].includes(value)) {
                throw new Error('Invalid mandatory tag name.');
              }

              exemptionValue = { tag: value };

            } else {
              throw new Error(
                'Only vm_size and tags exemptions are supported.'
              );
            }

            // Validate justification and approval ticket.
            if (!reason || reason.length > 2000) {
              throw new Error('Invalid business justification.');
            }

            if (!/^[A-Za-z0-9_-]{3,80}$/.test(ticket)) {
              throw new Error('Invalid ticket number.');
            }

            // Validate expiry date.
            if (!/^\d{4}-\d{2}-\d{2}$/.test(expiryDate)) {
              throw new Error('Invalid expiry date format.');
            }

            const expiresAt = expiryDate + 'T23:59:59Z';

            if (
              !Number.isFinite(Date.parse(expiresAt)) ||
              Date.parse(expiresAt) <= Date.now()
            ) {
              throw new Error('Expiry date must be in the future.');
            }

            // Determine central exemption file.
            const path = `exemptions/${application}.json`;

            let file = null;
            let configuration = { exemptions: [] };

            // Read existing exemptions or prepare a new file.
            try {
              const fileResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'main'
              });

              file = fileResponse.data;

              if (file.type !== 'file') {
                throw new Error('Exemption configuration is not a file.');
              }

              configuration = JSON.parse(
                Buffer.from(file.content, 'base64').toString('utf8')
              );

            } catch (error) {
              if (error.status === 404) {
                core.info(`Creating exemption file for ${application}`);
              } else {
                throw error;
              }
            }

            if (!Array.isArray(configuration.exemptions)) {
              throw new Error('Invalid exemption configuration.');
            }

            // Prevent duplicate exemption entries.
            const duplicate = configuration.exemptions.some(e =>
              e.application === application &&
              e.policy === policy &&
              e.resource === resource &&
              (policy === 'vm_size'
                ? e.approved_size === value
                : e.tag === value)
            );

            if (duplicate) {
              throw new Error('Duplicate exemption request.');
            }

            // Add the new exemption entry.
            configuration.exemptions.push({
              application,
              policy,
              resource,
              ...exemptionValue,
              reason,
              ticket,
              expires_at: expiresAt
            });

            // Create an exemption branch.
            const main = await github.rest.git.getRef({
              owner,
              repo,
              ref: 'heads/main'
            });

            const branch = `opa-exemption/issue-${issue}`;

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: main.data.object.sha
            });

            // Write the exemption JSON.
            const updateRequest = {
              owner,
              repo,
              path,
              branch,
              message: `Propose OPA exemption from issue #${issue}`,
              content: Buffer.from(
                JSON.stringify(configuration, null, 2) + '\n'
              ).toString('base64')
            };

            if (file) {
              updateRequest.sha = file.sha;
            }

            await github.rest.repos.createOrUpdateFileContents(
              updateRequest
            );

            // Create a pull request for administrator review.
            const pull = await github.rest.pulls.create({
              owner,
              repo,
              title: `OPA exemption: ${application} - ${policy}`,
              head: branch,
              base: 'main',
              body:
                `Exemption requested in #${issue}.\n\n` +
                `Repository: ${repository}\n\n` +
                `Application: ${application}\n\n` +
                `Policy: ${policy}\n\n` +
                `Resource: ${resource}\n\n` +
                `Exception value: ${value}\n\n` +
                `Ticket: ${ticket}\n\n` +
                `Expires: ${expiresAt}\n\n` +
                `Review the proposed JSON change before merging.`
            });

            // Comment on the original issue.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue,
              body:
                `Approval received from @${context.actor}.\n\n` +
                `Proposed exemption PR: #${pull.data.number}.\n\n` +
                `The exemption becomes active after review and merge.`
            });

            core.info(`Created exemption PR #${pull.data.number}`);
