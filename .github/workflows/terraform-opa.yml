
name: Terraform OPA Policy Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-opa:
    name: Terraform and OPA Validation
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_vm_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=plan.tfplan

      - name: Convert Terraform Plan to JSON
        run: terraform show -json plan.tfplan > plan.tfplan.json

      - name: Install OPA
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Validate OPA Policies
        run: opa check policies

      - name: Show Policy Violations
        run: |
          opa eval \
            --format pretty \
            --data policies \
            --data context.json \
            --data exemptions.json \
            --input plan.tfplan.json \
            'data.terraform.governance.deny'

      
      
      - name: Enforce OPA Governance
        run: |
          decision=$(opa eval \
            --format raw \
            --data policies \
            --data context.json \
            --data exemptions.json \
            --input plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "OPA Governance Decision: $decision"

          if [ "$decision" != "true" ]; then
            echo "OPA policy validation FAILED"
            exit 1
          fi

          echo "OPA policy validation PASSED"


      
            # Application A - Terraform validation
      - name: Application A - Terraform Init
        working-directory: applications/application-a
        run: terraform init -input=false

      - name: Application A - Terraform Validate
        working-directory: applications/application-a
        run: terraform validate

      - name: Application A - Terraform Plan
        working-directory: applications/application-a
        run: terraform plan -input=false -out=plan.tfplan

      - name: Application A - Convert Plan to JSON
        working-directory: applications/application-a
        run: terraform show -json plan.tfplan > plan.tfplan.json

      # Application B - Terraform validation
      - name: Application B - Terraform Init
        working-directory: applications/application-b
        run: terraform init -input=false

      - name: Application B - Terraform Validate
        working-directory: applications/application-b
        run: terraform validate

      - name: Application B - Terraform Plan
        working-directory: applications/application-b
        run: terraform plan -input=false -out=plan.tfplan

      - name: Application B - Convert Plan to JSON
        working-directory: applications/application-b
        run: terraform show -json plan.tfplan > plan.tfplan.json

      
      # Dummy-testing Terraform validation
      - name: Dummy Testing - Terraform Init
        working-directory: applications/dummy-testing
        run: terraform init -input=false

      - name: Dummy Testing - Terraform Validate
        working-directory: applications/dummy-testing
        run: terraform validate

      - name: Dummy Testing - Terraform Plan
        working-directory: applications/dummy-testing
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform plan -input=false -out=plan.tfplan

      - name: Dummy Testing - Convert Plan to JSON
        working-directory: applications/dummy-testing
        run: terraform show -json plan.tfplan > plan.tfplan.json

      - name: Dummy Testing - Verify Approved Exemption
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking dummy-testing with approved exemption"

          approved=$(opa eval \
            --format raw \
            --data policies \
            --data applications/dummy-testing/context.json \
            --data exemptions/dummy-testing.json \
            --input applications/dummy-testing/plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "Approved exemption decision: $approved"

          if [ "$approved" != "true" ]; then
            echo "FAILED: Approved exemption was not accepted"
            exit 1
          fi

          echo "PASSED: Approved exemption accepted"

      - name: Dummy Testing - Verify Rejection Without Exemption
        shell: bash
        run: |
          set -euo pipefail

          echo '{"exemptions":[]}' > /tmp/no-exemptions.json

          rejected=$(opa eval \
            --format raw \
            --data policies \
            --data applications/dummy-testing/context.json \
            --data /tmp/no-exemptions.json \
            --input applications/dummy-testing/plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "Without exemption decision: $rejected"

          if [ "$rejected" != "false" ]; then
            echo "FAILED: Unapproved VM size was not rejected"
            exit 1
          fi

          echo "PASSED: Unapproved VM size correctly rejected"
  

      # Application-specific OPA exemption validation
      - name: Validate Application-Specific Exemptions
        shell: bash
        run: |
          set -euo pipefail

          echo "===================================="
          echo "TEST 1: Application A with exemption"
          echo "===================================="

          app_a_decision=$(opa eval \
            --format raw \
            --data policies \
            --data applications/application-a/context.json \
            --data exemptions/application-a.json \
            --input applications/application-a/plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "Application A Decision: $app_a_decision"

          echo "===================================="
          echo "TEST 2: Application B without exemption"
          echo "===================================="

          app_b_decision=$(opa eval \
            --format raw \
            --data policies \
            --data applications/application-b/context.json \
            --data exemptions/application-b.json \
            --input applications/application-b/plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "Application B Decision: $app_b_decision"

          echo "===================================="
          echo "TEST 3: Application B using A's exemption"
          echo "===================================="

          isolation_decision=$(opa eval \
            --format raw \
            --data policies \
            --data applications/application-b/context.json \
            --data exemptions/application-a.json \
            --input applications/application-b/plan.tfplan.json \
            'data.terraform.governance.allow')

          echo "Application Isolation Decision: $isolation_decision"

          echo "===================================="
          echo "FINAL VALIDATION"
          echo "===================================="

          if [ "$app_a_decision" != "true" ]; then
            echo "FAILED: Application A exemption was not accepted."
            exit 1
          fi

          if [ "$app_b_decision" != "false" ]; then
            echo "FAILED: Application B did not follow baseline policy."
            exit 1
          fi

          if [ "$isolation_decision" != "false" ]; then
            echo "FAILED: Application B incorrectly used Application A's exemption."
            exit 1
          fi

          echo "PASSED: Application A exemption accepted."
          echo "PASSED: Application B baseline violation rejected."
          echo "PASSED: Cross-application exemption rejected."
          echo "All application-specific OPA tests PASSED."