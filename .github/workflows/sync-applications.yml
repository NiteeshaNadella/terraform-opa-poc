
name: Sync OPA Exemption Applications

on:
  push:
    branches:
      - main
    paths:
      - "applications/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-applications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: pip install ruamel.yaml

      - name: Update application dropdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True

          form_path = Path(
              ".github/ISSUE_TEMPLATE/exemption-request.yml"
          )
          apps_path = Path("applications")

          applications = sorted(
              p.name
              for p in apps_path.iterdir()
              if p.is_dir() and not p.name.startswith(".")
          )

          if not applications:
              raise SystemExit("No application folders found")

          with form_path.open(encoding="utf-8") as file:
              form = yaml.load(file)

          for field in form["body"]:
              if field.get("id") == "application":
                  field["attributes"]["options"] = applications
                  break
          else:
              raise SystemExit("Application dropdown not found")

          with form_path.open("w", encoding="utf-8") as file:
              yaml.dump(form, file)

          print("Dropdown applications:", applications)
          PY

      - name: Commit updated Issue Form
        shell: bash
        run: |
          if git diff --quiet -- .github/ISSUE_TEMPLATE/exemption-request.yml; then
            echo "Application dropdown already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/ISSUE_TEMPLATE/exemption-request.yml
          git commit -m "Sync OPA exemption application dropdown"
          git push
